services:
  jelantik-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jelantik-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      GIN_MODE: release
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: jelantik
      DB_PASSWORD: JelantikUser@2025!
      DB_NAME: jelantik_db
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
    networks:
      - jelantik-network

  postgres:
    image: postgres:16-alpine
    container_name: jelantik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jelantik
      POSTGRES_PASSWORD: JelantikUser@2025!
      POSTGRES_DB: jelantik_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jelantik -d jelantik_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jelantik-network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jelantik-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@jelantik.com
      PGADMIN_DEFAULT_PASSWORD: Admin@2025!
    ports:
      - "5050:80"
    networks:
      - jelantik-network

volumes:
  postgres_data:
    driver: local

networks:
  jelantik-network:
    driver: bridge
